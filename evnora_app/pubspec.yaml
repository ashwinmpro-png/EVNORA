name: evnora_app
description: Evnora - Empowering People, Enabling Progress. A job portal and skill development platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Network & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1

  # Local Storage & Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Firebase (Push Notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Authentication
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  # linkedin_login: ^3.0.0  # For LinkedIn OAuth

  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Media & Camera
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  cached_network_image: ^3.3.1

  # Payment Integration
  razorpay_flutter: ^1.3.6

  # UI Components
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  lottie: ^3.0.0
  carousel_slider: ^4.2.1
  
  # Forms & Validation
  flutter_form_builder: ^9.5.0
  form_builder_validators: ^11.0.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  connectivity_plus: ^5.0.2
  permission_handler: ^11.2.0
  flutter_dotenv: ^5.1.0
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  
  # PDF & Documents
  syncfusion_flutter_pdfviewer: ^24.1.41
  open_filex: ^4.4.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
